services:
  abstec:
    platform: linux/amd64
    build: .
    image: abstec-suite:latest
    shm_size: "1gb"
    volumes:
      - ${ABSTEC_INPUT_ROOT:-./in}:/data/in:ro
      - ${ABSTEC_OUTPUT_ROOT:-./out}:/data/out
    environment:
      YEAR: ${YEAR:-2026}
      DAY_OF_YEAR: ${DAY_OF_YEAR:-1}
      SITE: ${SITE:-aksu}
      OUTPUT_DIR: ${OUTPUT_DIR:-/data/out}
      DRY_RUN: ${DRY_RUN:-1}
      RUNNER: ${RUNNER:-wine}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-900}
      WINEDEBUG: ${WINEDEBUG:--all}
      PYTHONUNBUFFERED: "1"
